]},'Nuwara Eliya':{tag:'TEA COUNTRY',intro:'Cooler air, rolling tea country and a slower rhythm high above the coast.',stay:'1–2 nights',best:'Ideal when you want a cooler highland break.',things:['Tea estates','Highland viewpoints','Gardens','Scenic drives']},Dambulla:{tag:'HERITAGE',intro:'A practical cultural base connecting cave temples, Sigiriya and the wider Cultural Triangle.',stay:'1 night',best:'Useful as a flexible base when combining several heritage sites.',things:['Cave temple','Cultural Triangle','Countryside','Sigiriya gateway']}};const n=qs.get('place')||'Ella',d=data[n]||data.Ella;document.title=n+' · Lankaora';document.getElementById('detail').innerHTML='<section class="page-hero"><p class="eyebrow">'+d.tag+'</p><h1>'+n+'<br><em>in focus.</em></h1><p>'+d.intro+'</p></section><div class="guide"><div><p class="eyebrow">SIGNATURE EXPERIENCES</p><h2>What to do</h2><div class="page-grid">'+d.things.map((x,i)=>'<div class="meta-box"><span>0'+(i+1)+'</span><strong>'+x+'</strong></div>').join('')+'</div></div><div class="guide-meta"><div class="meta-box"><span>IDEAL STAY</span><strong>'+d.stay+'</strong></div><div class="meta-box"><span>WHEN</span><strong>'+d.best+'</strong></div></div></div><div class="cta-panel"><h2>Put '+n+' on your journey.</h2><p>Build a route around the places and experiences you care about.</p><a href="build.html">Build My Trip →</a></div>';</script></main><footer class="footer-simple"><strong>Lankaora</strong> — Explore Sri Lanka Now</footer><div class="mobile-menu" id="mobileMenu" aria-hidden="true">

<script>
(function(){
 const path=location.pathname.replace(/\\/g,'/');
 document.querySelectorAll('.nav nav a').forEach(a=>{
   const href=(a.getAttribute('href')||'').split('#')[0].split('?')[0];
   const target=href.replace(/^\.\//,'').replace(/^\.\.\//,'');
   const current=path.endsWith(target)||((target==='index.html'||target==='')&&/\/$/.test(path));
   if(current)a.setAttribute('aria-current','page');
 });
 const btn=document.querySelector('.mobile-menu-btn'), menu=document.getElementById('mobileMenu'), close=document.getElementById('mobileClose');
 if(!btn||!menu)return;
 const open=()=>{menu.classList.add('open');menu.setAttribute('aria-hidden','false');btn.setAttribute('aria-expanded','true');close&&close.focus()};
 const shut=()=>{menu.classList.remove('open');menu.setAttribute('aria-hidden','true');btn.setAttribute('aria-expanded','false');btn.focus()};
 btn.setAttribute('aria-expanded','false'); btn.addEventListener('click',open);
 close&&close.addEventListener('click',shut);
 menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{menu.classList.remove('open');menu.setAttribute('aria-hidden','true');btn.setAttribute('aria-expanded','false')}));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu.classList.contains('open'))shut()});

<script>
(function(){
  const wrap = document.querySelector('.nav-explore');
  const parent = document.querySelector('.nav-dropdown');
  const mobileBtn = document.querySelector('.mobile-menu-btn');
  const menu = document.getElementById('mobileMenu');
  const closeBtn = document.getElementById('mobileClose');
  const mobileToggle = document.querySelector('.mobile-explore-toggle');
  const mobileSub = document.getElementById('mobileExploreSubmenu');

  // Desktop: click toggles submenu; clicking a submenu item navigates normally.
  if (wrap && parent) {
    parent.addEventListener('click', function(e){
      // First click opens the submenu instead of navigating.
      // Second click follows explore.html.
      if (!wrap.classList.contains('is-open')) {
        e.preventDefault();
        wrap.classList.add('is-open');
        parent.setAttribute('aria-expanded','true');
      }
    });
    document.addEventListener('click', function(e){
      if (!wrap.contains(e.target)) {
        wrap.classList.remove('is-open');
        parent.setAttribute('aria-expanded','false');
      }
    });
    parent.addEventListener('keydown', function(e){
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        wrap.classList.add('is-open');
        parent.setAttribute('aria-expanded','true');
        const first=wrap.querySelector('.nav-explore-submenu a');
        if(first) first.focus();
      }
      if(e.key === 'Escape'){
        wrap.classList.remove('is-open');
        parent.setAttribute('aria-expanded','false');
      }
    });
  }

  // Mobile menu + mobile Explore submenu.
  if(menu && mobileBtn){
    const openMenu=()=>{
      menu.classList.add('open');
      menu.setAttribute('aria-hidden','false');
      mobileBtn.setAttribute('aria-expanded','true');
      if(closeBtn) closeBtn.focus();
    };
    const shutMenu=()=>{
      menu.classList.remove('open');
      menu.setAttribute('aria-hidden','true');
      mobileBtn.setAttribute('aria-expanded','false');
      if(mobileToggle) mobileToggle.setAttribute('aria-expanded','false');
      if(mobileSub) mobileSub.hidden=true;
      mobileBtn.focus();
    };
    mobileBtn.setAttribute('aria-expanded','false');
    mobileBtn.addEventListener('click',openMenu);
    if(closeBtn) closeBtn.addEventListener('click',shutMenu);
    if(mobileToggle && mobileSub){
      mobileToggle.addEventListener('click',()=>{
        const expanded=mobileToggle.getAttribute('aria-expanded')==='true';
        mobileToggle.setAttribute('aria-expanded',String(!expanded));
        mobileSub.hidden=expanded;
      });
    }
    menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{
      menu.classList.remove('open');
      menu.setAttribute('aria-hidden','true');
      mobileBtn.setAttribute('aria-expanded','false');
    }));
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape' && menu.classList.contains('open')) shutMenu();
    });
  }

  // Active page state.
  const path=location.pathname.replace(/\\/g,'/');
  document.querySelectorAll('.nav nav a, .mobile-menu a').forEach(a=>{
    const href=(a.getAttribute('href')||'').split('#')[0].split('?')[0];
    const target=href.replace(/^\.\//,'').replace(/^\.\.\//,'');
    const current=path.endsWith(target)||((target==='index.html'||target==='')&&/\/$/.test(path));
    if(current) a.setAttribute('aria-current','page');
  });
})();
</script>
